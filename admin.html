<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grand Multi GYM — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --black:#050505;
  --panel:rgba(17,17,17,.72);
  --gold:#f5b900;
  --gold2:#ffd75a;
  --muted:#9b9b9b;
  --white:#f8f8f6;
  --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Manrope,sans-serif}
body{
  min-height:100vh;
  color:var(--white);
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 30%,rgba(245,185,0,.13),transparent 28%),
    radial-gradient(circle at 15% 85%,rgba(245,185,0,.08),transparent 30%),
    #050505;
}
body:before{
  content:"";
  position:fixed;inset:0;pointer-events:none;opacity:.28;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:42px 42px;
}
.login{
  width:min(410px,calc(100% - 32px));
  position:relative;
  padding:42px 34px 27px;
  border:1px solid rgba(245,185,0,.18);
  border-radius:25px;
  background:linear-gradient(145deg,rgba(25,25,25,.82),rgba(8,8,8,.68));
  box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 45px rgba(245,185,0,.06);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}
.logo-ring{
  width:72px;height:72px;margin:0 auto 22px;
  border-radius:50%;
  display:grid;place-items:center;
  border:1px solid rgba(245,185,0,.65);
  box-shadow:0 0 0 6px rgba(245,185,0,.045),0 0 35px rgba(245,185,0,.15);
  overflow:hidden;
}
.logo-ring img{width:100%;height:100%;object-fit:cover}
.brand{
  text-align:center;
  font-family:Anton,sans-serif;
  font-size:clamp(52px,15vw,76px);
  line-height:.88;
  letter-spacing:.5px;
  text-transform:uppercase;
  color:var(--gold);
  text-shadow:0 0 24px rgba(245,185,0,.12);
}
.subtitle{
  text-align:center;
  margin:9px 0 28px;
  font-size:13px;
  font-weight:800;
  letter-spacing:.24em;
  color:#d5d5d5;
  text-transform:uppercase;
}
.field{
  position:relative;
  margin-bottom:15px;
}
.field input{
  width:100%;height:52px;
  border:1px solid var(--line);
  border-radius:14px;
  outline:none;
  color:var(--white);
  background:rgba(0,0,0,.42);
  padding:0 48px 0 16px;
  font:600 14px Manrope,sans-serif;
  transition:.2s ease;
}
.field input:focus{
  border-color:rgba(245,185,0,.75);
  box-shadow:0 0 0 4px rgba(245,185,0,.07);
}
.eye{
  position:absolute;right:7px;top:50%;
  transform:translateY(-50%);
  width:38px;height:38px;
  border:0;border-radius:11px;
  background:transparent;color:#8d8d8d;
  cursor:pointer;font-size:15px;
  transition:.18s ease;
}
.eye:hover{background:rgba(245,185,0,.08);color:var(--gold)}
.remember{
  display:flex;align-items:center;justify-content:center;
  gap:9px;margin:5px 0 20px;
  color:#999;font-size:11.5px;font-weight:600;
  cursor:pointer;user-select:none;
}
.switch{
  width:30px;height:17px;position:relative;display:inline-block;flex:none;
}
.switch input{opacity:0;width:0;height:0}
.slider{
  position:absolute;inset:0;
  border-radius:30px;
  background:#303030;
  border:1px solid #454545;
  transition:.25s ease;
}
.slider:before{
  content:"";position:absolute;
  width:11px;height:11px;left:2px;top:2px;
  border-radius:50%;background:#aaa;
  transition:.25s cubic-bezier(.4,1.4,.6,1);
}
.switch input:checked + .slider{
  background:rgba(245,185,0,.28);
  border-color:rgba(245,185,0,.7);
}
.switch input:checked + .slider:before{
  transform:translateX(13px);
  background:var(--gold);
  box-shadow:0 0 10px rgba(245,185,0,.55);
}
.login-btn{
  width:100%;height:50px;
  border:0;border-radius:14px;
  cursor:pointer;
  color:#111;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  font:800 13px Manrope,sans-serif;
  letter-spacing:.08em;
  text-transform:uppercase;
  box-shadow:0 12px 28px rgba(245,185,0,.16);
  transition:transform .16s ease,box-shadow .2s ease,filter .2s ease;
}
.login-btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.04);
  box-shadow:0 16px 34px rgba(245,185,0,.22);
}
.login-btn:active{transform:translateY(1px) scale(.99)}
.footer{
  margin-top:24px;text-align:center;
  color:#555;font-size:9.5px;font-weight:600;
  letter-spacing:.08em;
}
.footer span{color:#6d6d6d}
.demo-msg{
  display:none;text-align:center;margin:11px 0 -2px;
  color:#ff6464;font-size:11px;font-weight:700;
}
@media(max-width:480px){
  .login{padding:34px 24px 23px;border-radius:22px}
  .brand{font-size:56px}
  .logo-ring{width:64px;height:64px}
}
</style>
</head>
<body>
<main class="login">
  <div class="logo-ring">
    <img src="assets/logo.jpg" alt="Grand Multi Gym" onerror="this.style.display='none'">
  </div>

  <div class="brand">GRAND MULTI GYM</div>
  <div class="subtitle">ADMIN</div>

  <div class="field">
    <input id="pass" type="password" placeholder="Enter admin password"
           autocomplete="current-password"
           onkeydown="if(event.key==='Enter')login()">
    <button class="eye" type="button" onclick="togglePass()" aria-label="Show password">◉</button>
  </div>

  <label class="remember">
    <span class="switch">
      <input id="rememberMe" type="checkbox" checked>
      <span class="slider"></span>
    </span>
    <span>Remember Me on this Device</span>
  </label>

  <button class="login-btn" onclick="login()">Login to Dashboard</button>
  <div id="msg" class="demo-msg">Incorrect password</div>

  <div class="footer">© 2026 <span>Grand Multi Gym</span> · Admin Panel</div>
</main>

<script>
const ADMIN_PASSWORD = 'grandmultigym@1234';

function togglePass(){
  const input=document.getElementById('pass');
  input.type=input.type==='password'?'text':'password';
}

function login(){
  const msg=document.getElementById('msg');
  if(document.getElementById('pass').value===ADMIN_PASSWORD){
    msg.style.display='none';
    document.querySelector('.login').animate(
      [{transform:'scale(1)'},{transform:'scale(1.015)'},{transform:'scale(1)'}],
      {duration:260,easing:'ease-out'}
    );
    alert('Login successful — connect this screen to your existing dashboard.');
  }else{
    msg.style.display='block';
    document.getElementById('pass').animate(
      [{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],
      {duration:220}
    );
  }
}
</script>
</body>
</html>
