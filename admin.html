<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Multi Gym — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0908;--panel:#141210;--panel-2:#1c1916;
  --gold:#f2b705;--gold-soft:rgba(242,183,5,0.14);
  --ivory:#f4f1ea;--smoke:#9d968a;--line:#2b2620;
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;color:var(--ivory);font-family:'Manrope',sans-serif;min-height:100vh;
  background:
    radial-gradient(circle at 8% 8%, rgba(242,183,5,0.16), transparent 40%),
    radial-gradient(circle at 92% 18%, rgba(242,183,5,0.10), transparent 38%),
    radial-gradient(circle at 50% 100%, rgba(242,183,5,0.08), transparent 45%),
    var(--black);
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;margin:0;}
.top{
  background:rgba(20,18,16,0.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(242,183,5,0.18);padding:16px 24px;
  display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:10px;
}
.top .t{font-size:19px;color:var(--gold);}
.wrap{max-width:960px;margin:0 auto;padding:32px 24px 120px;}
.note{font-size:12.5px;color:var(--smoke);margin-top:6px;line-height:1.5;}
.glass{
  background:rgba(20,18,16,0.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(242,183,5,0.16);border-radius:var(--radius);
}
.block{padding:24px;margin-bottom:20px;}
.block h4{font-size:16px;color:var(--gold);margin-bottom:16px;text-transform:none;font-weight:800;}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-bottom:10px;align-items:center;}
.row.single{grid-template-columns:1fr auto;}
.row input,.row textarea,.field input,.field textarea,.field select{
  background:rgba(0,0,0,0.35);border:1px solid var(--line);color:var(--ivory);
  padding:9px 11px;font-size:13.5px;font-family:inherit;width:100%;border-radius:var(--radius-sm);
}
.row input:focus,.row textarea:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold);}
button.del{background:none;border:1px solid var(--line);color:#e05252;padding:8px 12px;border-radius:var(--radius-sm);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--smoke);margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:var(--radius-sm);font-weight:800;font-size:13.5px;border:1.5px solid transparent;background:none;cursor:pointer;transition:transform .12s ease;}
.btn:active{transform:scale(0.97);}
.btn-gold{background:var(--gold);color:#141210;}
.btn-line{border-color:var(--gold);color:var(--gold);}
.btn-ghost{border-color:var(--line);color:var(--ivory);}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{max-width:360px;width:100%;text-align:center;padding:40px 32px;}
.login-box input{width:100%;margin:14px 0;}
.actions-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:rgba(20,18,16,0.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(242,183,5,0.18);
  padding:14px 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;
}
.stars-input{width:70px;}
#toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  color:#141210;padding:12px 22px;font-weight:800;font-size:13.5px;z-index:400;display:none;border-radius:var(--radius-sm);
}
#toast.ok{background:var(--gold);}
#toast.err{background:#e05252;color:#fff;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.stat-card{padding:18px;text-align:center;}
.stat-card b{font-family:'Anton';font-size:26px;color:var(--gold);display:block;}
.stat-card span{font-size:11.5px;color:var(--smoke);text-transform:uppercase;letter-spacing:.02em;}
.quicknav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.quicknav a{font-size:12px;font-weight:700;color:var(--smoke);border:1px solid var(--line);padding:6px 12px;border-radius:100px;}
.quicknav a:hover{color:var(--gold);border-color:var(--gold);}
.item-flash{animation:flash 1s ease;}
@keyframes flash{0%{background:var(--gold-soft);}100%{background:transparent;}}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:none;margin-right:4px;}
.dirty-dot.show{display:inline-block;}
@media(max-width:680px){
  .row{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .top{flex-direction:column;align-items:flex-start;}
  .actions-bar{flex-direction:column;align-items:stretch;}
}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-box glass">
    <img src="assets/logo.jpg" alt="Grand Multi Gym" style="width:88px;height:88px;border-radius:50%;object-fit:cover;margin-bottom:18px;border:2px solid var(--gold);">
    <h3 style="font-size:22px;">GRAND MULTI ADMIN</h3>
    <div style="position:relative;">
      <input type="password" id="pass" placeholder="Enter password" style="padding-right:42px;" onkeydown="if(event.key==='Enter')login()">
      <button type="button" onclick="togglePass()" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--smoke);font-size:16px;padding:6px;">👁</button>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--smoke);justify-content:center;margin-bottom:16px;">
      <input type="checkbox" id="rememberMe" style="width:auto;" checked> Remember me on this device
    </label>
    <button class="btn btn-gold" style="width:100%;justify-content:center;" onclick="login()">Log In</button>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="top">
    <div style="display:flex;align-items:center;gap:12px;">
      <img src="assets/logo.jpg" alt="Grand Multi Gym" style="width:34px;height:34px;border-radius:50%;object-fit:cover;">
      <div class="t">Grand Multi Gym — Admin</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <span id="dirtyIndicator" class="note" style="margin:0;display:flex;align-items:center;"><span class="dirty-dot" id="dirtyDot"></span><span id="dirtyText"></span></span>
      <a href="index.html" class="btn btn-ghost" target="_blank">View Site ↗</a>
      <button class="btn btn-ghost" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="wrap">

    <div class="block glass" id="dashboard">
      <h4>Dashboard</h4>
      <div class="stat-grid">
        <div class="stat-card glass"><b id="statPricing">0</b><span>Pricing</span></div>
        <div class="stat-card glass"><b id="statRules">0</b><span>Rules</span></div>
        <div class="stat-card glass"><b id="statFaq">0</b><span>FAQs</span></div>
        <div class="stat-card glass"><b id="statReviews">0</b><span>Reviews</span></div>
      </div>
      <div class="quicknav">
        <a href="#heroBlock">Hero</a>
        <a href="#pricingBlock">Pricing</a>
        <a href="#rulesBlock">Rules</a>
        <a href="#faqBlock">FAQs</a>
        <a href="#reviewsBlock">Reviews</a>
      </div>
      <p class="note" id="syncStatus">Connecting…</p>
    </div>

    <div class="block glass" id="heroBlock">
      <h4>Hero Text</h4>
      <div class="field"><label>Eyebrow line</label><input id="h_eyebrow"></div>
      <div class="field"><label>Subheadline</label><textarea id="h_sub" rows="2"></textarea></div>
    </div>

    <div class="block glass" id="pricingBlock">
      <h4>Pricing Plans</h4>
      <div id="priceList"></div>
      <button class="btn btn-line" onclick="addPricing()">+ Add Plan</button>
    </div>

    <div class="block glass" id="rulesBlock">
      <h4>Gym Rules</h4>
      <div id="rulesList"></div>
      <button class="btn btn-line" onclick="addRule()">+ Add Rule</button>
    </div>

    <div class="block glass" id="faqBlock">
      <h4>FAQs</h4>
      <div id="faqList"></div>
      <button class="btn btn-line" onclick="addFaq()">+ Add FAQ</button>
    </div>

    <div class="block glass" id="reviewsBlock">
      <h4>Reviews</h4>
      <div id="reviewList"></div>
      <button class="btn btn-line" onclick="addReview()">+ Add Review</button>
      <p class="note">Tick "Demo" for placeholder reviews so the site labels them clearly.</p>
    </div>

  </div>
  <div class="actions-bar">
    <button class="btn btn-gold" onclick="saveToFirestore()">💾 Save Changes</button>
    <button class="btn btn-ghost" onclick="downloadConfig()">⬇ Download Backup</button>
    <span class="note" style="margin:0;" id="saveStatus"></span>
  </div>
</div>

<div id="toast"></div>

<!-- Firebase (client SDK only) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAX1iDS9IEI6EugPpgjXOGOOr_2t5w9mE0",
  authDomain: "grand-muilt-gym.firebaseapp.com",
  projectId: "grand-muilt-gym",
  storageBucket: "grand-muilt-gym.firebasestorage.app",
  messagingSenderId: "437245103225",
  appId: "1:437245103225:web:ee1acc451091ad1ca9d8a8"
};
let db = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}catch(err){ console.warn('Firebase not configured yet.', err); }
</script>

<script>
const ADMIN_PASSWORD = 'admin123';
const REMEMBER_KEY = 'gmg_admin_logged_in';
let dirty = false;

function togglePass(){
  const p = document.getElementById('pass');
  p.type = p.type === 'password' ? 'text' : 'password';
}
function login(){
  if(document.getElementById('pass').value === ADMIN_PASSWORD){
    if(document.getElementById('rememberMe').checked){ localStorage.setItem(REMEMBER_KEY,'1'); }
    enterApp();
  } else { alert('Incorrect password.'); }
}
function logout(){
  localStorage.removeItem(REMEMBER_KEY);
  dirty = false;
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('pass').value='';
}
function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  loadFromFirestore();
}
window.addEventListener('DOMContentLoaded', ()=>{
  try{
    if(localStorage.getItem(REMEMBER_KEY) === '1'){ enterApp(); }
  }catch(err){ /* localStorage unavailable in this context — login screen stays up */ }
});
window.addEventListener('beforeunload', (e)=>{
  if(dirty){ e.preventDefault(); e.returnValue=''; }
});
function markDirty(){
  dirty = true;
  document.getElementById('dirtyDot').classList.add('show');
  document.getElementById('dirtyText').textContent = 'Unsaved changes';
  updateStats();
}
function clearDirty(){
  dirty = false;
  document.getElementById('dirtyDot').classList.remove('show');
  document.getElementById('dirtyText').textContent = '';
}

const defaultState = {
  hero: { eyebrow:'Kattanam, Kerala — Since 2003', sub:"Discipline today. Strength tomorrow. Weight training, cardio, personal coaching, and special training for Army & Kerala Police aspirants — for men and women." },
  pricing: [
    {name:'General Gym / Weight Training', price:500, duration:'Ask us (duration to be confirmed)', desc:'Full access to weight training equipment and floor coaching.', popular:true},
    {name:'Cardio Training', price:700, duration:'Ask us (duration to be confirmed)', desc:'Cardio conditioning sessions with equipment access.', popular:false}
  ],
  rules: [
    'Wear proper shoes','Bring your towel & water bottle','Use equipment properly',
    'Wipe down equipment after use','Maintain silence & respect others','Be consistent, be disciplined'
  ],
  faq: [
    {q:'What are the gym fees?', a:'Weight training is ₹500 and cardio training is ₹700. Contact us for the exact duration these cover.'},
    {q:'Where is Grand Multi Gym located?', a:'Mankavil Garden, Bharanikkavu, Kattanam, Kerala 690503.'},
    {q:'Do you provide personal training?', a:'Yes, personal training is available.'},
    {q:'Do you provide Army or Kerala Police special training?', a:'Yes, we offer special training for Indian Army and Kerala Police aspirants.'},
    {q:'Do you train both men and women?', a:'Yes, everyone trains here.'},
    {q:'How can I book?', a:'Use the Book Now button, WhatsApp us, or call 9778575418.'}
  ],
  reviews: [
    {name:'Godz Gym', text:'Super than fitness world.', stars:5, demo:false, src:'Google'},
    {name:'Surya Babu', text:'💪', stars:5, demo:false, src:'Google'},
    {name:'kailas Shankar', text:'Very good experience.', stars:5, demo:false, src:'Google'},
    {name:'Vishal Murali', text:'Less fees compared to the nearby ones. Average equipment. Great personal support.', stars:4, demo:false, src:'Google'},
    {name:'S.J creations', text:"It's a good place.", stars:5, demo:false, src:'Google'},
    {name:'Arun', text:'Placeholder demo review — replace with a real one.', stars:5, demo:true, src:'Demo'}
  ]
};
let state = JSON.parse(JSON.stringify(defaultState));

function init(){
  document.getElementById('h_eyebrow').value = state.hero.eyebrow;
  document.getElementById('h_sub').value = state.hero.sub;
  document.getElementById('h_eyebrow').oninput = e => { state.hero.eyebrow = e.target.value; markDirty(); };
  document.getElementById('h_sub').oninput = e => { state.hero.sub = e.target.value; markDirty(); };
  renderPricing(); renderRules(); renderFaq(); renderReviews();
  updateStats();
}

function updateStats(){
  document.getElementById('statPricing').textContent = state.pricing.length;
  document.getElementById('statRules').textContent = state.rules.length;
  document.getElementById('statFaq').textContent = state.faq.length;
  document.getElementById('statReviews').textContent = state.reviews.length;
}

function loadFromFirestore(){
  const statusEl = document.getElementById('syncStatus');
  if(!db){ statusEl.textContent = 'Not connected to Firebase yet.'; init(); return; }
  statusEl.textContent = 'Loading current site content…';
  db.collection('site').doc('config').get().then(docSnap => {
    if(docSnap.exists){ state = Object.assign(JSON.parse(JSON.stringify(defaultState)), docSnap.data()); }
    init();
    statusEl.textContent = 'Connected — showing live site content.';
  }).catch(err => { statusEl.textContent = 'Could not load: ' + err.message; init(); });
}

function scrollAndFocus(containerId, itemId){
  requestAnimationFrame(()=>{
    const el = document.getElementById(itemId);
    if(!el) return;
    el.scrollIntoView({behavior:'smooth', block:'center'});
    el.classList.add('item-flash');
    const firstInput = el.querySelector('input, textarea');
    if(firstInput) firstInput.focus();
  });
}

function renderPricing(){
  document.getElementById('priceList').innerHTML = state.pricing.map((p,i)=>`
    <div class="block glass" style="padding:16px;" id="price-item-${i}">
      <div class="row"><input value="${esc(p.name)}" oninput="state.pricing[${i}].name=this.value;markDirty()" placeholder="Plan name">
      <input type="number" value="${p.price}" oninput="state.pricing[${i}].price=this.value;markDirty()" placeholder="Price ₹">
      <button class="del" onclick="state.pricing.splice(${i},1);renderPricing();markDirty();showToast('Plan removed','ok')">Delete</button></div>
      <div class="row single"><input value="${esc(p.duration)}" oninput="state.pricing[${i}].duration=this.value;markDirty()" placeholder="Duration (e.g. per month)">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" style="width:auto;" ${p.popular?'checked':''} onchange="state.pricing[${i}].popular=this.checked;markDirty()"> Popular</label></div>
      <input value="${esc(p.desc)}" oninput="state.pricing[${i}].desc=this.value;markDirty()" placeholder="Short description" style="margin-top:8px;">
    </div>`).join('');
}
function addPricing(){
  state.pricing.push({name:'New Plan',price:0,duration:'Set duration',desc:'Describe this plan.',popular:false});
  renderPricing(); markDirty(); updateStats();
  scrollAndFocus('priceList', 'price-item-'+(state.pricing.length-1));
  showToast('Plan added','ok');
}

function renderRules(){
  document.getElementById('rulesList').innerHTML = state.rules.map((r,i)=>`
    <div class="row single" id="rule-item-${i}">
      <input value="${esc(r)}" oninput="state.rules[${i}]=this.value;markDirty()">
      <button class="del" onclick="state.rules.splice(${i},1);renderRules();markDirty();showToast('Rule removed','ok')">Delete</button>
    </div>`).join('');
}
function addRule(){
  state.rules.push('New rule');
  renderRules(); markDirty(); updateStats();
  scrollAndFocus('rulesList', 'rule-item-'+(state.rules.length-1));
  showToast('Rule added','ok');
}

function renderFaq(){
  document.getElementById('faqList').innerHTML = state.faq.map((f,i)=>`
    <div class="row" id="faq-item-${i}">
      <input value="${esc(f.q)}" oninput="state.faq[${i}].q=this.value;markDirty()" placeholder="Question">
      <input value="${esc(f.a)}" oninput="state.faq[${i}].a=this.value;markDirty()" placeholder="Answer">
      <button class="del" onclick="state.faq.splice(${i},1);renderFaq();markDirty();showToast('FAQ removed','ok')">Delete</button>
    </div>`).join('');
}
function addFaq(){
  state.faq.push({q:'New question?',a:'Answer here.'});
  renderFaq(); markDirty(); updateStats();
  scrollAndFocus('faqList', 'faq-item-'+(state.faq.length-1));
  showToast('FAQ added','ok');
}

function renderReviews(){
  document.getElementById('reviewList').innerHTML = state.reviews.map((r,i)=>`
    <div class="block glass" style="padding:16px;" id="review-item-${i}">
      <div class="row"><input value="${esc(r.name)}" oninput="state.reviews[${i}].name=this.value;markDirty()" placeholder="Name">
      <input class="stars-input" type="number" min="1" max="5" value="${r.stars}" oninput="state.reviews[${i}].stars=this.value;markDirty()" placeholder="Stars">
      <button class="del" onclick="state.reviews.splice(${i},1);renderReviews();markDirty();showToast('Review removed','ok')">Delete</button></div>
      <input value="${esc(r.text)}" oninput="state.reviews[${i}].text=this.value;markDirty()" placeholder="Review text" style="margin-bottom:8px;">
      <div class="row single"><input value="${esc(r.src||'')}" oninput="state.reviews[${i}].src=this.value;markDirty()" placeholder="Source (e.g. Google)">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" style="width:auto;" ${r.demo?'checked':''} onchange="state.reviews[${i}].demo=this.checked;markDirty()"> Demo</label></div>
    </div>`).join('');
}
function addReview(){
  state.reviews.push({name:'New',text:'Review text',stars:5,demo:true,src:'Demo'});
  renderReviews(); markDirty(); updateStats();
  scrollAndFocus('reviewList', 'review-item-'+(state.reviews.length-1));
  showToast('Review added','ok');
}

function esc(s){ return String(s??'').replace(/"/g,'&quot;'); }

function downloadConfig(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'config-backup.json';
  a.click();
  showToast('Backup downloaded','ok');
}
function saveToFirestore(){
  const statusEl = document.getElementById('saveStatus');
  if(!db){ statusEl.textContent = 'Not connected to Firebase.'; showToast('Not connected to Firebase','err'); return; }
  statusEl.textContent = 'Saving…';
  db.collection('site').doc('config').set(state, {merge:true}).then(()=>{
    statusEl.textContent = 'Saved just now.';
    clearDirty();
    showToast('Saved to website','ok');
  }).catch(err => {
    statusEl.textContent = 'Save failed.';
    showToast('Save failed: ' + err.message, 'err');
  });
}
function showToast(msg, type){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className = type==='err' ? 'err' : 'ok';
  t.style.display='block';
  setTimeout(()=>t.style.display='none',2200);
}
</script>
</body>
</html>
