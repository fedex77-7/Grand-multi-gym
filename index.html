<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Now Contact Options</title>
  <style>
    /* Reset & Page Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f9;
    }

    /* Book Now Primary Button */
    .btn-primary {
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    /* Modal Card */
    .modal-content {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 350px;
      text-align: center;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 22px;
      font-weight: bold;
      color: #888888;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #000000;
    }

    .modal-content h3 {
      margin-bottom: 16px;
      color: #333333;
    }

    /* Action Buttons Inside Modal */
    .contact-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-btn {
      display: block;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      color: #ffffff;
      font-weight: bold;
      font-size: 15px;
      transition: opacity 0.2s ease;
    }

    .contact-btn:hover {
      opacity: 0.9;
    }

    .call-btn {
      background-color: #007bff;
    }

    .whatsapp-btn {
      background-color: #25d366;
    }

    .insta-btn {
      background-color: #e1306c;
    }
  </style>
</head>
<body>

  <!-- Trigger Button -->
  <button id="bookNowBtn" class="btn-primary">Book Now</button>

  <!-- Contact Modal Window -->
  <div id="contactModal" class="modal-overlay">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <h3>Contact Us</h3>
      <div class="contact-options">
        <!-- Call Option -->
        <a href="tel:+919778575418" class="contact-btn call-btn">
          📞 Call Now
        </a>

        <!-- WhatsApp Option -->
        <a href="https://wa.me/919778575418" target="_blank" class="contact-btn whatsapp-btn">
          💬 Message on WhatsApp
        </a>

        <!-- Instagram Option -->
        <a href="https://ig.me/m/your_username" target="_blank" class="contact-btn insta-btn">
          📸 DM on Instagram
        </a>
      </div>
    </div>
  </div>

  <script>
    const bookNowBtn = document.getElementById('bookNowBtn');
    const contactModal = document.getElementById('contactModal');
    const closeModal = document.getElementById('closeModal');

    // Open Modal when clicking "Book Now"
    bookNowBtn.addEventListener('click', () => {
      contactModal.style.display = 'flex';
    });

    // Close Modal when clicking the "X" button
    closeModal.addEventListener('click', () => {
      contactModal.style.display = 'none';
    });

    // Close Modal when clicking outside the content box
    window.addEventListener('click', (e) => {
      if (e.target === contactModal) {
        contactModal.style.display = 'none';
      }
    });
  </script>

</body>
</html>
